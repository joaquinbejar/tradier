name: Update Changelog

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        env:
          GIT_CLIFF_VERSION: "2.12.0"
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            -o git-cliff.tar.gz
          tar -xzf git-cliff.tar.gz
          sudo mv "git-cliff-${GIT_CLIFF_VERSION}/git-cliff" /usr/local/bin/git-cliff
          git-cliff --version

      - name: Generate CHANGELOG.md
        run: git-cliff --config cliff.toml --verbose --output CHANGELOG.md

      - name: Open pull request with updated CHANGELOG
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/changelog-${{ github.ref_name }}
          base: main
          commit-message: "chore(changelog): update for ${{ github.ref_name }}"
          title: "chore(changelog): update for ${{ github.ref_name }}"
          body: |
            CHANGELOG.md regenerated by git-cliff on tag `${{ github.ref_name }}`.

            Opened automatically by the `Update Changelog` workflow because `main` is protected.
          delete-branch: true
